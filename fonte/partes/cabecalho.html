<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}}</title>
<meta name="description" content="{{descricao}}">
{{robots}}
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Elea Forneria">
<meta property="og:title" content="{{titulo}}">
<meta property="og:description" content="{{descricao}}">
<meta property="og:image" content="{{imagem}}">
<meta name="theme-color" content="#4A301D">
<link rel="icon" type="image/png" href="/assets/img/brand/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/img/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>
{{aviso}}
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo" id="topo">
  <div class="container topo__in">
    <!-- Wordmark tipográfico (referência aprovada). O símbolo oficial em círculo segue no rodapé e no favicon. -->
    <a class="topo__logo" href="/" aria-label="Elea Forneria — início"><span class="marca-texto" aria-hidden="true">Elea<span>Forneria</span></span></a>
    <nav class="menu" id="menu" aria-label="Principal">
        {{links}}
        <a class="btn btn--terracota menu__reservar" href="{{whatsapp:Olá! Gostaria de fazer uma reserva na Elea.}}" target="_blank" rel="noopener">Reservar</a>
    </nav>
    <div class="topo__acoes">
      <!-- "Minha conta" (conta.html) fica fora do menu até a área do cliente ser contratada (docs/EVOLUCOES_FUTURAS.md). -->
      <a class="icone-btn" href="/encomendas.html#carrinho" aria-label="Lista de encomenda">{{icone:carrinho}}<span class="badge" data-carrinho-qtd hidden>0</span></a>
      <a class="btn btn--terracota topo__reservar" href="{{whatsapp:Olá! Gostaria de fazer uma reserva na Elea.}}" target="_blank" rel="noopener">Reservar</a>
      <button class="icone-btn menu-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">{{icone:menu}}</button>
    </div>
  </div>
</header>
<main id="conteudo">
