# Link de TESTE no GitHub Pages via Actions: remonta as páginas (fonte/ -> site/) e publica site/.
# DESLIGADO no push (15/11/2026): a conta está com o Actions bloqueado por cobrança. Enquanto isso o link
# sai do branch gh-pages (Settings > Pages > Deploy from a branch > gh-pages / root), atualizado com:
#   git subtree push --prefix site origin gh-pages
# Resolvida a cobrança: volte o "push" abaixo e mude Source para "GitHub Actions".
# O site continua com noindex (EM_TESTE = true em ferramentas/montar-paginas.mjs).
name: Publicar teste (GitHub Pages)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar páginas
        run: node ferramentas/montar-paginas.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
